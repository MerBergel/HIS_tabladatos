<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Huerto Inteligente · Visualizador CSV</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.upload{
    background:rgba(255,255,255,0.1);
    padding:25px;
    border-radius:20px;
    border:2px dashed #38bdf8;
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:30px;
}

canvas{
    width:100% !important;
    max-height:400px;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    color:black;
}

th{
    background:#0ea5e9;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f1f5f9;
}

.info{
    background:rgba(255,255,255,0.1);
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

</style>
</head>

<body>

<h1>🌱 Huerto Inteligente · Visualizador CSV</h1>

<div class="upload">

    <h2>Sube el CSV de la micro:bit</h2>

    <input type="file" id="csvFile" accept=".csv">

</div>

<div class="info" id="stats">

    Esperando archivo...

</div>

<div class="card">
    <canvas id="tempChart"></canvas>
</div>

<div class="card">
    <canvas id="humChart"></canvas>
</div>

<div class="card">
    <canvas id="lightChart"></canvas>
</div>

<div class="card table-container">

    <table id="dataTable"></table>

</div>

<script>

let tempChart = null;
let humChart = null;
let lightChart = null;

document.getElementById('csvFile').addEventListener('change', function(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const text = e.target.result;

        const lines = text.trim().split('\n');

        const headers = lines[0].split(',');

        const data = [];

        for(let i=1;i<lines.length;i++){

            const row = lines[i].split(',');

            if(row.length >= headers.length){
                data.push(row);
            }
        }

        createTable(headers,data);

        createCharts(data);

        createStats(data);
    }

    reader.readAsText(file);

});

function createTable(headers,data){

    let html = '<tr>';

    headers.forEach(h=>{
        html += `<th>${h}</th>`;
    });

    html += '</tr>';

    data.forEach(row=>{

        html += '<tr>';

        row.forEach(col=>{
            html += `<td>${col}</td>`;
        });

        html += '</tr>';
    });

    document.getElementById('dataTable').innerHTML = html;
}

function createCharts(data){

    const hora = [];
    const temperatura = [];
    const luz = [];
    const humedad = [];

    data.forEach(row=>{

        hora.push(row[1]);

        temperatura.push(Number(row[2]));

        luz.push(Number(row[3]));

        humedad.push(Number(row[4]));
    });

    // ELIMINAR GRÁFICAS ANTERIORES

    if(tempChart) tempChart.destroy();
    if(humChart) humChart.destroy();
    if(lightChart) lightChart.destroy();

    // ======================
    // TEMPERATURA
    // ======================

    tempChart = new Chart(
    document.getElementById('tempChart'),
    {
        type:'line',

        data:{
            labels:hora,

            datasets:[{
                label:'Temperatura °C',
                data:temperatura,
                borderWidth:3,
                tension:0.3
            }]
        },

        options:{
            responsive:true,

            plugins:{
                title:{
                    display:true,
                    text:'🌡️ Temperatura'
                }
            }
        }
    });

    // ======================
    // HUMEDAD
    // ======================

    humChart = new Chart(
    document.getElementById('humChart'),
    {
        type:'line',

        data:{
            labels:hora,

            datasets:[{
                label:'Humedad del Suelo',
                data:humedad,
                borderWidth:3,
                tension:0.3
            }]
        },

        options:{
            responsive:true,

            plugins:{
                title:{
                    display:true,
                    text:'💧 Humedad del Suelo'
                }
            }
        }
    });

    // ======================
    // LUZ
    // ======================

    lightChart = new Chart(
    document.getElementById('lightChart'),
    {
        type:'line',

        data:{
            labels:hora,

            datasets:[{
                label:'Luz',
                data:luz,
                borderWidth:3,
                tension:0.3
            }]
        },

        options:{
            responsive:true,

            plugins:{
                title:{
                    display:true,
                    text:'☀️ Luz'
                }
            }
        }
    });
}

function createStats(data){

    const temperaturas = data.map(r=>Number(r[2]));
    const humedad = data.map(r=>Number(r[4]));

    const mediaTemp =
    (
        temperaturas.reduce((a,b)=>a+b,0)
        /
        temperaturas.length
    ).toFixed(1);

    const mediaHum =
    (
        humedad.reduce((a,b)=>a+b,0)
        /
        humedad.length
    ).toFixed(1);

    document.getElementById('stats').innerHTML = `

        <h2>📊 Resumen del Huerto</h2>

        <p>🌡️ Temperatura media: <b>${mediaTemp} °C</b></p>

        <p>💧 Humedad media del suelo: <b>${mediaHum}</b></p>

        <p>📁 Registros cargados: <b>${data.length}</b></p>

    `;
}

</script>

</body>
</html>
